<!DOCTYPE html>
<html>
<head>
    <title>PvP Analyzer</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
            color: white;
            font-family: Arial;
            text-align: center;
        }

        .card {
            background: #1e1e1e;
            padding: 40px;
            width: 750px;
            margin: 60px auto;
            border-radius: 20px;
            box-shadow: 0 0 20px #00ff88;
        }

        select, input, button {
            padding: 10px;
            margin: 8px;
            border-radius: 10px;
            border: none;
            width: 60%;
        }

        button {
            background: #00ff88;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            color: #00ff88;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>PvP Analyzer</h1>

    <form action="/analyze" method="POST" enctype="multipart/form-data">

        <label>View Mode:</label><br>
        <select name="view_mode" id="view_mode" onchange="togglePlayerName()">
            <option value="First Person">First Person</option>
            <option value="Spectator Mode">Spectator Mode</option>
        </select><br>

        <div id="playerField" style="display:none;">
            <label>Player Name (Spectator Only):</label><br>
            <input type="text" name="player_name"><br>
        </div>

        <label>Gamemode:</label><br>
        <select name="gamemode">
            <option>Build UHC</option>
            <option>Boxing</option>
            <option>Nodebuff</option>
            <option>Sumo</option>
            <option>Bridge</option>
            <option>SkyWars</option>
            <option>BedWars</option>
            <option>Combo</option>
        </select><br>

        <label>Weapon:</label><br>
        <select name="weapon">
            <option>Diamond Sword</option>
            <option>Iron Sword</option>
            <option>Netherite Sword</option>
            <option>Diamond Axe</option>
            <option>Iron Axe</option>
            <option>Fist</option>
            <option>Fishing Rod</option>
            <option>Bow</option>
            <option>Crossbow</option>
        </select><br>

        <label>Gear:</label><br>
        <select name="gear">
            <option>Full Diamond</option>
            <option>Full Iron</option>
            <option>Netherite</option>
            <option>Mixed</option>
            <option>No Armor</option>
        </select><br>

        <label>Upload Video:</label><br>
        <input type="file" name="video" required><br>

        <button type="submit">Analyze</button>
    </form>

    <br>
    <a href="/history">Match History</a> |
    <a href="/premium">Premium</a>
</div>

<script>
function togglePlayerName() {
    var mode = document.getElementById("view_mode").value;
    var field = document.getElementById("playerField");

    if (mode === "Spectator Mode") {
        field.style.display = "block";
    } else {
        field.style.display = "none";
    }
}
</script>

</body>
</html>
